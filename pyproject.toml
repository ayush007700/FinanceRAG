[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-rag"
version = "2.0.0"
description = "LangGraph RAG over Postgres/pgvector for Source Advisors tax consulting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "boto3>=1.34.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "pypdf>=4.3.0",
  "pdfplumber>=0.11.0",
  "python-multipart>=0.0.9",
  "cohere>=5.5.0",
  "redis>=5.0.0",
  "langsmith>=0.1.0",
  "langfuse>=3.0.0",
  "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
finance-rag = "finance_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008: File(...) / Form(...) / Depends(...) / Header(...) in argument defaults
# is FastAPI's documented dependency-injection idiom, not an accidental shared
# mutable default.
"src/finance_rag/api/app.py" = ["B008"]
"src/finance_rag/api/auth.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable Postgres (docker compose up -d postgres)",
]
