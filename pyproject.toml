[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-rag"
version = "1.0.0"
description = "Advanced LangGraph + Neo4j RAG for Source Advisors tax consulting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "openai>=1.40.0",
  "neo4j>=5.20.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
  "numpy>=1.26.0",
  "rank-bm25>=0.2.2",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "boto3>=1.34.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "pypdf>=4.3.0",
  "python-multipart>=0.0.9",
  "cohere>=5.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
finance-rag = "finance_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
