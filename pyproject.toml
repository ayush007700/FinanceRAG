[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-rag"
version = "2.0.0"
description = "LangGraph RAG over Postgres/pgvector for Source Advisors tax consulting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  # The Postgres checkpointer is a separate distribution from langgraph itself.
  # Undeclared, it was present on developer machines and absent from the image,
  # so build_checkpointer caught the ImportError and multi-turn memory was
  # silently off in the one place it mattered.
  "langgraph-checkpoint-postgres>=2.0.0",
  "openai>=1.40.0",
  "sqlalchemy>=2.0.30",
  # The `pool` extra, not just `binary`: threads.py owns an explicit
  # ConnectionPool so the checkpointer's connection outlives the call that
  # created it, and that lives in the separate psycopg-pool distribution.
  "psycopg[binary,pool]>=3.2.0",
  "alembic>=1.13.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  # OIDC bearer tokens. [crypto] brings the RSA/EC verification that JWKS keys
  # need; cryptography is already in the tree via other dependencies.
  "PyJWT[crypto]>=2.8.0",
  "python-dotenv>=1.0.0",
  "tiktoken>=0.7.0",
  "numpy>=1.26.0",
  "httpx>=0.27.0",
  "tenacity>=8.5.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "boto3>=1.34.0",
  "opentelemetry-api>=1.26.0",
  "opentelemetry-sdk>=1.26.0",
  "opentelemetry-exporter-otlp>=1.26.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  # X-Ray-shaped trace ids and the X-Ray trace header. Without the first,
  # X-Ray drops every span the collector forwards; without the second, the
  # ALB's trace header is ignored and each hop starts a new trace.
  "opentelemetry-sdk-extension-aws>=2.0.0",
  "opentelemetry-propagator-aws-xray>=1.0.0",
  "pypdf>=4.3.0",
  "pdfplumber>=0.11.0",
  "python-multipart>=0.0.9",
  "cohere>=5.5.0",
  "redis>=5.0.0",
  "langsmith>=0.1.0",
  "langfuse>=3.0.0",
  "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
finance-rag = "finance_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
# Not --strict. The value here is catching real type confusion in our own code,
# not annotating every helper, and a gate nobody can pass gets switched off.
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Third-party packages that ship no stubs. Without this every import of them is
# an error about the library rather than about us, which drowns the findings
# that matter.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "cohere.*", "langchain.*", "langchain_community.*", "pdfplumber.*", "prometheus_client.*"]
ignore_missing_imports = true

# Modules that predate the gate, with a count each so the debt is visible and
# shrinkable. These are excluded, not silenced globally: every other module is
# checked, so a new file or a regression in a clean one fails CI.
#
# Most are third-party interface friction rather than latent bugs -- the openai
# client's **kwargs overloads, redis returning `bytes | str` without
# decode_responses, langchain's union-typed message content. Fixing them means
# changing how we call those libraries, which is worth doing deliberately rather
# than in the change that turned the gate on.
[[tool.mypy.overrides]]
module = [
  "finance_rag.embeddings.openai_embeddings",   # 9  openai **kwargs overloads
  "finance_rag.cache.semantic_cache",           # 5  redis bytes | str
  "finance_rag.monitoring.metrics_emit",        # 4  boto3 cloudwatch shapes
  "finance_rag.agent.graph",                    # 4  langchain union content
  "finance_rag.storage.object_store",           # 2
  "finance_rag.agent.orchestrator",             # 2
  "finance_rag.store.pgvector_store",           # 1
  "finance_rag.pipeline.launcher",              # 1  boto3
]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# B008: File(...) / Form(...) / Depends(...) / Header(...) in argument defaults
# is FastAPI's documented dependency-injection idiom, not an accidental shared
# mutable default.
"src/finance_rag/api/app.py" = ["B008"]
"src/finance_rag/api/auth.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable Postgres (docker compose up -d postgres)",
]
