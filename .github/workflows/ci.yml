name: CI

# PRs only. A push to main used to run this as well, which tested the same
# commit twice the moment a release PR was opened: once as "the latest push"
# and once as "the merge into master". The PR run is the one that matters --
# it checks out the synthetic merge, which is what ships -- so it is the one
# kept. The trade is that a direct push to main gets no feedback until a PR
# names it. Deploys are cd.yml's job, not this one's.
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # The UI had no tests and CI never built it: a broken bundle was first
  # noticed by the deploy. Both change here. The sign-in gate, the credential
  # slot and the OIDC expiry handling each have tests, and `next build` runs
  # so a type error fails the PR rather than the release.
  ui:
    name: UI test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Build with a provider configured so the sign-in path is compiled
          # and type-checked, not tree-shaken out.
          NEXT_PUBLIC_OIDC_ISSUER: https://example.invalid/
          NEXT_PUBLIC_OIDC_CLIENT_ID: ci

  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finrag -d finrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Runner-local database, so store integration tests execute rather than skip.
      DATABASE_URL: postgresql+psycopg://finrag:finrag@127.0.0.1:5432/finrag
      OPENAI_API_KEY: ""
      COHERE_API_KEY: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The image installs from requirements.lock, so a lock that has drifted
      # from pyproject.toml builds something the tests never ran against.
      #
      # Seeded with the current lock on purpose. pip-compile honours the pins in
      # an existing output file and changes only what pyproject.toml forces, so
      # this asks "does the lock still satisfy the declared dependencies?" --
      # not "has anything on PyPI released since?". Compiling into an empty file
      # resolves everything to newest and fails whenever any of 120 transitive
      # dependencies ships a release, which is roughly daily.
      #
      # Compares pins only. The "# via" annotations are derived provenance, not
      # part of the installed set, and they reflow between equivalent forms --
      # a single-line `# via x` becomes a three-line block the moment a second
      # dependent appears. Diffing them fails the build on cosmetics.
      - name: Check the lock is in sync with pyproject
        run: |
          pip install pip-tools
          cp requirements.lock /tmp/check.lock
          pip-compile --quiet --strip-extras --output-file=/tmp/check.lock pyproject.toml
          pins() { grep -E '^[a-zA-Z0-9._-]+==' "$1" | sort; }
          diff <(pins requirements.lock) <(pins /tmp/check.lock) || { echo "::error::requirements.lock is stale; regenerate with: pip-compile --strip-extras --output-file=requirements.lock pyproject.toml"; exit 1; }

      # No "|| true": lint failures fail the build. The codebase is clean, and a
      # gate that cannot fail is not a gate.
      - name: Ruff
        run: ruff check src tests scripts migrations

      # Same rule as ruff: no "|| true". Modules that predate the gate are
      # listed in pyproject's mypy overrides with their error counts, so the
      # debt is visible rather than hidden behind a step that cannot fail.
      - name: Mypy
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
