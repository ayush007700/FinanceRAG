name: CI

# Runs on every push to main and on PRs into either branch, including the
# main -> master release PR. Deploys are cd.yml's job, not this one's.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finrag -d finrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Runner-local database, so store integration tests execute rather than skip.
      DATABASE_URL: postgresql+psycopg://finrag:finrag@127.0.0.1:5432/finrag
      OPENAI_API_KEY: ""
      COHERE_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The image installs from requirements.lock, so a lock that has drifted
      # from pyproject.toml builds something the tests never ran against.
      - name: Check the lock is in sync with pyproject
        run: |
          pip install pip-tools
          pip-compile --quiet --strip-extras --output-file=/tmp/check.lock pyproject.toml
          diff <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/check.lock)             || { echo "::error::requirements.lock is stale; regenerate with pip-compile"; exit 1; }

      # No "|| true": lint failures fail the build. The codebase is clean, and a
      # gate that cannot fail is not a gate.
      - name: Ruff
        run: ruff check src tests scripts migrations

      # Same rule as ruff: no "|| true". Modules that predate the gate are
      # listed in pyproject's mypy overrides with their error counts, so the
      # debt is visible rather than hidden behind a step that cannot fail.
      - name: Mypy
        run: mypy

      - name: Apply migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
