name: Security

# Four scanners, each covering something the others cannot see. They run on
# every push and PR, and weekly against main, because a dependency that was
# clean on merge day acquires CVEs afterwards -- the weekly run is what catches
# those without a code change to trigger it.
#
# Every job fails the build. A scan that only annotates is a scan nobody reads.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # uploads SARIF to the Security tab
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Secrets in the history. Full clone on purpose: a secret committed and
  # reverted is still in the history, and a shallow scan of HEAD would miss it.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Known CVEs in the exact pins the image installs. Scanning the lock rather
  # than pyproject.toml is the point: pyproject says ">=", the lock says what
  # actually ships.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit against the lock
        run: |
          pip install pip-audit
          # --strict: an unresolvable package is a failure, not a skip. A
          # scanner that silently skips what it cannot resolve reports clean
          # for the wrong reason.
          #
          # --no-deps: audit exactly the pins listed rather than re-resolving.
          # The lock is complete -- every transitive is already in it -- so
          # resolution adds nothing and would only re-introduce the newest-
          # version drift the CI lock check exists to exclude.
          pip-audit --strict --no-deps --requirement requirements.lock --desc on

  # ---------------------------------------------------------------------------
  # Filesystem and IaC: misconfigurations in Terraform and the Dockerfile, plus
  # a second opinion on dependency CVEs across both Python and npm.
  # ---------------------------------------------------------------------------
  trivy:
    name: Filesystem & IaC scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Two passes over one cached database. The first prints a table and
      # fails the job; the second writes SARIF for the Security tab. One pass
      # with format: sarif fails silently -- the findings go to a file, and
      # the log shows only "exit code 1", which is what happened the first
      # time this ran.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
          # Accepted findings, each with its reason, live in .trivyignore.yaml.
          trivyignores: .trivyignore.yaml
          # Provider binaries and the venv are not ours to scan.
          skip-dirs: .venv,node_modules,.terraform,web/node_modules,web/.next,web/out
      - name: Trivy SARIF for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          trivyignores: .trivyignore.yaml
          skip-dirs: .venv,node_modules,.terraform,web/node_modules,web/.next,web/out
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_CHECK_UPDATE: "true"
      - name: Upload to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # Static analysis of our own code. Python for the service, JavaScript for the
  # UI. security-extended widens the query set beyond the default at the cost
  # of a few more false positives, which is the right trade for a codebase
  # this size.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}
