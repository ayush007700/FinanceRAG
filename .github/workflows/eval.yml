name: Eval

# Separate from CI on purpose: this workflow spends real money on model calls and
# needs an indexed corpus, so it must not run on every push. It is the gate for
# retrieval quality regressions, not for correctness.
#
# Three ways in, one job:
#
#   pull_request -> master   The release gate. Every PR that would deploy runs
#                            the golden set without the LLM judge and fails on
#                            regression against the baseline. Judging is
#                            skipped because it doubles the cost and measures
#                            faithfulness, which the retrieval metrics gate
#                            already bounds through hallucinated-citation count.
#   schedule                 Weekly drift check with the judge on.
#   workflow_dispatch        Manual, with the judge and baseline options.
#
# The gate needs OPENAI_API_KEY and COHERE_API_KEY as repository secrets. For
# it to actually block a merge, the branch ruleset on master must list
# "Golden-set evaluation" as a required check -- a workflow that runs but is
# not required is advisory.

on:
  pull_request:
    branches: [master]
    # Docs and UI changes cannot move retrieval metrics; skipping them keeps
    # the gate's cost proportional to what it can catch.
    paths-ignore:
      - "docs/**"
      - "web/**"
      - "**/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:
    inputs:
      save_baseline:
        description: "Overwrite data/eval/baseline.json with this run's results"
        type: boolean
        default: false
      no_judge:
        description: "Skip LLM judging (cheaper, drops faithfulness metrics)"
        type: boolean
        default: false
  schedule:
    # Weekly drift check: model endpoints change under pinned aliases.
    - cron: "0 6 * * 1"

# A second push to the same PR cancels the eval already running for it; the
# result of the superseded run could never be what merges.
concurrency:
  group: eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Golden-set evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finrag
          POSTGRES_PASSWORD: finrag
          POSTGRES_DB: finrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finrag -d finrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://finrag:finrag@127.0.0.1:5432/finrag
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      RERANK_PROVIDER: cohere
      # Redis is absent here; caching would mask real retrieval behaviour anyway.
      CACHE_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Index corpus
        run: finance-rag index data/corpus

      - name: Run evaluation
        env:
          # The release gate never judges and never saves a baseline: a gate
          # that can rewrite its own pass criterion is not a gate.
          IS_GATE: ${{ github.event_name == 'pull_request' }}
        run: |
          ARGS=""
          if [ "$IS_GATE" = "true" ] || [ "${{ inputs.no_judge }}" = "true" ]; then ARGS="$ARGS --no-judge"; fi
          if [ "$IS_GATE" != "true" ] && [ "${{ inputs.save_baseline }}" = "true" ]; then ARGS="$ARGS --save-baseline"; fi
          if [ "$IS_GATE" = "true" ]; then LABEL="gate-pr${{ github.event.pull_request.number }}-${GITHUB_SHA::7}"; else LABEL="ci-${GITHUB_SHA::7}"; fi
          # Not piped: a shell pipeline reports the last command's exit code,
          # and this script's non-zero exit is the whole point of the gate.
          python scripts/run_eval.py $ARGS --label "$LABEL"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: data/processed/eval_report.json

      - name: Upload updated baseline
        if: ${{ github.event_name != 'pull_request' && inputs.save_baseline }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-baseline
          path: data/eval/baseline.json
