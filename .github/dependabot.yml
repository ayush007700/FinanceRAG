# Four ecosystems, because the attack surface has four package managers: the
# Python service, the Next.js UI, the actions the pipelines run, and the base
# image the container is built from. Leaving any one out is the gap someone
# finds first.
#
# Weekly rather than daily: with 123 pinned Python packages, daily would open a
# PR most mornings and train everyone to merge without reading. Security
# advisories bypass the schedule and open immediately.
version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Same rule as npm: majors are migrations, bumped by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the LangChain family, which releases in lockstep and breaks
      # when versions drift apart. Reviewing them separately is worse than
      # reviewing them together.
      langchain:
        patterns: ["langchain*", "langgraph*", "langsmith"]
      # Observability and tooling move without touching request paths.
      observability:
        patterns: ["opentelemetry*", "prometheus-client", "langfuse", "structlog"]
    labels: ["dependencies", "python"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      next:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      # Types, lint config and build tooling: one PR, reviewed as a unit.
      tooling:
        patterns: ["@types/*", "eslint*", "@eslint/*", "typescript", "postcss", "tailwindcss"]
        update-types: ["minor", "patch"]
    ignore:
      # No majors, for anything. The first week produced vitest 3 -> 5, which
      # swapped the transformer and broke both the tests and the build, and
      # eslint-config-next 16 against next 15. A major is a migration with
      # release notes to read; it is bumped by hand when someone has read
      # them. Security advisories bypass this and still open a PR.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies", "ui"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Python minor is pinned across CI, the lock, .python-version and
      # the image; Dependabot bumped the image alone to 3.14 and the other
      # three did not follow. Patch releases of 3.12-slim are welcome; a new
      # minor is a coordinated change, not a dependency update.
      - dependency-name: "public.ecr.aws/docker/library/python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels: ["dependencies", "container"]
